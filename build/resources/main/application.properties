
# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/students_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# JWT
jwt.secret=ThisIsMyVerySecretKeyForStudentApi2026SpringBootJWT
jwt.expiration=86400000


# SPRING
spring.main.log-startup-info=true

# REDIS CACHE
spring.data.redis.host=localhost
spring.data.redis.port=6379


# GENERAL LOGGING
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# SetTimeOut External API

# Feign network timeout (Must be numbers in milliseconds)
# Request Data

spring.cloud.openfeign.client.config.thirdPartyClient.connectTimeout=2000
# Response Data
spring.cloud.openfeign.client.config.thirdPartyClient.readTimeout=3000



# YOUR APPLICATION

logging.level.com.example.StudentsApiC=INFO